    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #0a0105;
        color: #fff;
        cursor: none;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      ::selection {
        background: #ff2d85;
        color: white;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0105;
      }
      ::-webkit-scrollbar-thumb {
        background: #ff2d85;
        border-radius: 10px;
      }
      .glass {
        background: rgba(255, 45, 133, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 45, 133, 0.1);
      }
      .text-glow {
        text-shadow: 0 0 10px rgba(255, 45, 133, 0.5);
      }
      .gradient-pink {
        background: linear-gradient(135deg, #ff2d85 0%, #ff8aba 100%);
      }
      .luxury-border {
        position: relative;
      }
      .luxury-border::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0%;
        height: 1px;
        background: #ff2d85;
        transition: width 0.3s ease;
      }
      .luxury-border:hover::after {
        width: 100%;
      }
    </style>
